<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickCart Mobile · Progress</title>
<style>
:root{
  --bg:#f4f2ff; --card:#ffffff; --ink:#141118; --muted:#5b5575; --line:#e3ddf7; --soft:#efeaff;
  --yellow:#ffd400; --pink:#fb1a8e; --green:#0a9f45; --blue:#2a1bff; --amber:#b86e00; --red:#c2185b;
  --hero1:#2a1bff; --hero2:#6a11e8; --hero3:#b00699; --focus:#2a1bff;
  --s-todo:#8a84a3; --s-doing:#2a6df4; --s-blocked:#c2185b; --s-done:#0a9f45;
}
:root[data-theme="dark"]{
  --bg:#0e0a3a; --card:#1e1846; --ink:#f4f1ff; --muted:#c7bdf0; --line:#332a73; --soft:#2a2260;
  --green:#02f34c; --amber:#ffb300; --red:#ff5fae; --focus:#ffd400;
  --s-todo:#a59fc4; --s-doing:#6fa3ff; --s-blocked:#ff5fae; --s-done:#02f34c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
header{background:linear-gradient(135deg,var(--hero1),var(--hero2) 55%,var(--hero3));color:#fff;padding:24px 20px 20px}
.wrap{max-width:1200px;margin:0 auto}
.head{display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.01em}
.sub{opacity:.85;margin:2px 0 0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:stretch}
.stat{background:rgba(255,255,255,.14);border-radius:16px;padding:10px 14px;min-width:96px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:12px;opacity:.85}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:22px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;background:var(--yellow);color:#141118}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding:0 12px}
nav.tabs button{background:none;border:0;padding:14px 14px;font-weight:800;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--yellow)}
main{padding:20px}
.grid{display:grid;gap:14px}
.cols-3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;background:var(--soft);color:var(--ink);white-space:nowrap}
.chip.l-M{background:#ffe9a6;color:#4a3800}.chip.l-A{background:#c9e6ff;color:#06355c}.chip.l-D{background:#ffd0e6;color:#5c0634}
.chip.l-W{background:#d8d2ff;color:#25126b}.chip.l-I{background:#c8f7d8;color:#064d1f}.chip.l-Q{background:#ffe0c2;color:#5b2a00}.chip.l-X{background:#e4e4ea;color:#2b2b33}
.chip.st{color:#fff}.st-todo{background:var(--s-todo)}.st-doing{background:var(--s-doing)}.st-blocked{background:var(--s-blocked)}.st-done{background:var(--s-done);color:#04210f}
:root[data-theme="dark"] .chip.l-M,:root[data-theme="dark"] .chip.l-A,:root[data-theme="dark"] .chip.l-D,:root[data-theme="dark"] .chip.l-W,:root[data-theme="dark"] .chip.l-I,:root[data-theme="dark"] .chip.l-Q,:root[data-theme="dark"] .chip.l-X{filter:brightness(.95)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ffb800);border-radius:999px;transition:width .3s}
.bar.done>i{background:var(--s-done)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.phase{margin-bottom:14px;padding:0;overflow:hidden}
.phase>.ph{width:100%;text-align:left;background:none;border:0;padding:16px;cursor:pointer;display:block}
.phase .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.task{border:1px solid var(--line);border-radius:14px;margin-top:10px;background:var(--card)}
.task>.th{display:flex;gap:10px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.task .title{flex:1;min-width:200px;font-weight:700;background:none;border:0;text-align:left;cursor:pointer;padding:2px 0}
.task .detail{padding:4px 14px 14px;border-top:1px dashed var(--line)}
.task.done .title{text-decoration:line-through;opacity:.65}
select.status{border-radius:999px;border:1px solid var(--line);background:var(--card);padding:5px 8px;font-weight:800;font-size:13px}
.ac{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.ac input{margin-top:4px;width:18px;height:18px;accent-color:var(--s-done)}
textarea,input[type=search],input[type=number],input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}
textarea{min-height:64px;resize:vertical}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search]{max-width:260px}
.layerbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;cursor:pointer}
.layerbtn[aria-pressed="true"]{background:var(--yellow);color:#141118;border-color:var(--yellow)}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--soft);border-radius:18px;padding:10px;min-height:200px}
.col.over{outline:3px dashed var(--yellow)}
.col h4{margin:4px 6px 10px;display:flex;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;cursor:grab}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sev-H{color:var(--red);font-weight:900}.sev-M{color:var(--amber);font-weight:900}.sev-L{color:var(--green);font-weight:900}
.api-missing{color:var(--red);font-weight:800}.api-partial{color:var(--amber);font-weight:800}.api-ready{color:var(--green);font-weight:800}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#141118;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.tableWrap{overflow-x:auto}
ul.clean{margin:6px 0 0;padding-left:20px}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--soft);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>QuickCart Mobile · Development Progress</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="actions">
        <button class="btn ghost sm" id="btnTheme" aria-label="Toggle light and dark theme">Theme</button>
        <button class="btn ghost sm" id="btnSummary">Copy summary</button>
        <button class="btn ghost sm" id="btnExport">Export progress</button>
        <button class="btn ghost sm" id="btnImport">Import</button>
        <button class="btn sm" id="btnReset">Reset to file</button>
        <input type="file" id="fileImport" accept="application/json" hidden>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

 {"id":"R3","t":"Payments: money, webhooks and PCI scope","sev":"H","m":"Provider-hosted UI; server-side amounts; signed idempotent webhooks; reconciliation.","p":"P7"},
 {"id":"R4","t":"Public catalog route could expose admin-only data","sev":"M","m":"New customer DTO and route; review fields; keep admin policy for admin data.","p":"P1"},
 {"id":"R5","t":"API changes break the admin portal","sev":"M","m":"Backward-compatible changes only; admin impact checklist per task.","p":"P1"},
 {"id":"R6","t":"OTP or other state stored in memory breaks behind a load balancer","sev":"M","m":"Keep shared state in SQL; test with two instances.","p":"P8"},
 {"id":"R7","t":"Third-party setup lead time (SMS, Google Cloud, Apple, payment KYC, Play account)","sev":"M","m":"Start account setup early, in parallel with development.","p":"P7"},
 {"id":"R8","t":"Marathi translations are unreviewed","sev":"L","m":"Native review in P9; keep fallback to English.","p":"P9"},
 {"id":"R9","t":"CORS is open to any origin and secrets must not ship","sev":"M","m":"Restrict origins and move secrets to environment before release.","p":"P9"},
 {"id":"R10","t":"Production database drift: repo migrations do not prove a database is current","sev":"M","m":"Reviewed migration script and verification step per environment.","p":"P9"},
 {"id":"R11","t":"A SQL login password was committed and pushed to GitHub","sev":"H","m":"Rotate the password everywhere it was used; prefer Windows authentication; the NoSecretsInSourceTests guard blocks new credentials. Rewriting history is a separate, disruptive decision.","p":"P0"}
],
"decisions":[
 {"id":"D1","t":"Email/password ships first; phone OTP and social sign-in come later","s":"decided","n":"Keeps the existing JWT design. Interim Welcome pre-fills registration."},
 {"id":"D2","t":"Add ProductVariant with an additive migration for pack sizes","s":"decided","n":"Matches catalog rules; default variant keeps old clients working."},
 {"id":"D3","t":"Online UPI/card payments are in the first release","s":"decided","n":"Adds P7 before release. Provider still open (D9)."},
 {"id":"D4","t":"First release is Android only","s":"decided","n":"iOS stays in the backlog."},
 {"id":"D5","t":"Real EN/Marathi localization","s":"decided","n":"UI done; backend product translations in P1."},
 {"id":"D6","t":"Riverpod + go_router; light/dark follows system with manual override","s":"decided","n":"Already implemented."},
 {"id":"D7","t":"Approve extending authentication for OTP and social login","s":"open","n":"Needed before P8 starts."},
 {"id":"D8","t":"Customer product listing: new public route and customer DTO","s":"decided","n":"Implemented as GET /api/catalog/products (task 1.1). Admin policy on /api/products unchanged."},
 {"id":"D9","t":"Payment provider","s":"decided","n":"Razorpay (chosen 2026-10-09). Hosted checkout so card data never reaches us; test keys needed before building."},
 {"id":"D10","t":"Push notifications (FCM) in v1?","s":"open","n":"New external service; confirm."},
 {"id":"D11","t":"Crash reporting tool","s":"open","n":"Firebase Crashlytics or Sentry."},
 {"id":"D12","t":"DTO approach: hand-written, no code generation","s":"decided","n":"Recorded in docs/adr/ADR-001-mobile-data-layer.md."},
 {"id":"D13","t":"Database engine: keep SQL Server","s":"decided","n":"Decided 2026-10-07. PostgreSQL analysis kept in docs/adr/ADR-002-database-engine-postgresql.md."},
 {"id":"D14","t":"API returns all translations in each response (translations map)","s":"decided","n":"Chosen 2026-10-07. See docs/plans/P1-mrp-and-translations.md."},
 {"id":"D15","t":"Migrations are schema-only; demo MRP/Marathi values via a dev SQL script","s":"decided","n":"Keeps demo data out of schema history and production."},
 {"id":"D16","t":"No product write endpoint in 1.3/1.4; editing is task 1.12","s":"decided","n":"Until then values are set by SQL."},
 {"id":"D17","t":"Delivery time comes from configuration only (base + per km)","s":"decided","n":"No database change; store override later with 1.12."},
 {"id":"D18","t":"Public API exposes inStock and lowStock flags, never exact quantities","s":"decided","n":"Reduces data exposure."},
 {"id":"D19","t":"Interim demo location from app config until P4","s":"decided","n":"Coordinates are rounded to about 110 m before being sent."},
 {"id":"D20","t":"Password reset uses an emailed code typed into the app","s":"decided","n":"No deep links or domain needed now; pattern reused for phone OTP in P8."},
 {"id":"D21","t":"No email verification at registration in P2","s":"decided","n":"Real owner can reclaim via reset. Revisit with P8."},
 {"id":"D22","t":"New customers join the configured organization, else the only active one","s":"decided","n":"Ambiguity fails with a clear configuration error."},
 {"id":"D23","t":"Email provider (Gmail SMTP, SendGrid, SES, own server)","s":"open","n":"Not needed to build or test P2; Log mode for Development, Smtp configuration for real use."}
],
"guardrails":[
 "Evolve, do not rebuild: smallest safe change, preserve working behaviour.",
 "Mini-plan before edits and a summary after (docs/copilot-instructions.md sections 28 and 29).",
 "Database changes are additive and reviewable; never auto-run migrations in production.",
 "Keep API contracts backward compatible; check the admin portal for every change.",
 "Authorization and organization/store scope are enforced on the server; never trust client IDs.",
 "Orders keep price snapshots; inventory updates must be concurrency-safe.",
 "Design for several IIS instances: no state in server memory.",
 "No new infrastructure (Redis, Kafka, SignalR and similar) without a demonstrated need and approval.",
 "Tests for pricing, inventory, authorization and order processing; do not edit tests just to pass.",
 "Stop and ask before changing authentication, dropping data, or large refactors."
]
}
</script>

<script>
(function(){
"use strict";
var PLAN = JSON.parse(document.getElementById("plan-data").textContent);
var KEY = "quickcart-mobile-plan-v1";
var STATUSES = [["todo","To do"],["doing","In progress"],["blocked","Blocked"],["done","Done"]];
var WEIGHT = {S:1,M:3,L:5};
var TABS = [["overview","Overview"],["phases","Phases and tasks"],["board","Board"],["gaps","Gaps and risks"],["decisions","Decisions"]];
var mem = null;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function load(){
  var s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ s = mem; }
  s = s || {};
  s.t = s.t||{}; s.e = s.e||{}; s.d = s.d||{}; s.ui = s.ui||{};
  s.ui.tab = s.ui.tab||"overview"; s.ui.layers = s.ui.layers||[]; s.ui.open = s.ui.open||{}; s.ui.phasesOpen = s.ui.phasesOpen||{};
  s.v = s.v||5;
  return s;
}
var S = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ mem = JSON.parse(JSON.stringify(S)); }
}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(function(){t.classList.remove("show");},2200);}

var tasks = [], taskById = {}, phaseById = {};
PLAN.phases.forEach(function(p){ phaseById[p.id]=p; p.tasks.forEach(function(t){ t.phase=p.id; tasks.push(t); taskById[t.id]=t; }); });

function tState(id){ var b=taskById[id]; var o=S.t[id]||{}; return { s:o.s||b.st, n:o.n||"", b:o.b||b.bk||"", ac:(o.ac&&o.ac.length===b.ac.length)?o.ac:b.ac.map(function(){return b.st==="done";}) }; }
function setT(id,patch){ var cur=tState(id); S.t[id]={s:cur.s,n:cur.n,b:cur.b,ac:cur.ac.slice()}; for(var k in patch){S.t[id][k]=patch[k];} save(); }
function tProg(id){ var st=tState(id); if(st.s==="done")return 1; var done=st.ac.filter(Boolean).length; var frac=st.ac.length?done/st.ac.length:0; var base=st.s==="doing"?0.1:0; return Math.min(0.9,Math.max(base,frac*0.9)); }
function tW(id){ return WEIGHT[taskById[id].s]||1; }
function pProg(p){ var tot=0,got=0; p.tasks.forEach(function(t){var w=tW(t.id);tot+=w;got+=w*tProg(t.id);}); return tot?got/tot:0; }
function pPoints(p){ return p.tasks.reduce(function(a,t){return a+tW(t.id);},0); }
function pStatus(p){
  var sts=p.tasks.map(function(t){return tState(t.id).s;});
  if(sts.every(function(s){return s==="done";}))return "done";
  if(sts.indexOf("blocked")>=0)return "blocked";
  if(sts.some(function(s){return s!=="todo";})||pProg(p)>0)return "doing";
  return "todo";
}
function depsDone(p){ return p.deps.every(function(d){return pStatus(phaseById[d])==="done";}); }
function pct(x){ return Math.round(x*100); }
function overall(){ var tot=0,got=0; tasks.forEach(function(t){var w=tW(t.id);tot+=w;got+=w*tProg(t.id);}); return tot?got/tot:0; }
function counts(){ var c={todo:0,doing:0,blocked:0,done:0}; tasks.forEach(function(t){c[tState(t.id).s]++;}); return c; }
function remainingPoints(){ return tasks.reduce(function(a,t){return a+tW(t.id)*(1-tProg(t.id));},0); }
function chip(txt,cls){return '<span class="chip '+cls+'">'+esc(txt)+'</span>';}
function stChip(s){ var l=STATUSES.filter(function(x){return x[0]===s;})[0][1]; return chip(l,"st st-"+s); }
function layerChips(t){ return t.l.map(function(l){return chip(PLAN.layers[l].split(" ")[0],"l-"+l);}).join(" "); }
function bar(p,cls){ return '<div class="bar '+(cls||"")+'" role="progressbar" aria-valuenow="'+pct(p)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct(p)+'%"></i></div>'; }

function renderHeader(){
  document.getElementById("subtitle").textContent = PLAN.meta.title+" · plan updated "+PLAN.meta.updated;
  var o=overall(), c=counts(), r=2*Math.PI*40;
  var ring='<div class="ring" aria-label="Overall progress '+pct(o)+' percent"><svg width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="10"/><circle cx="48" cy="48" r="40" fill="none" stroke="#ffd400" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+(r*o).toFixed(1)+' '+r.toFixed(1)+'"/></svg><div class="pct">'+pct(o)+'%</div></div>';
  var done=PLAN.phases.filter(function(p){return pStatus(p)==="done";}).length;
  document.getElementById("stats").innerHTML = ring+
    '<div class="stat"><b>'+done+'/'+PLAN.phases.length+'</b><span>phases done</span></div>'+
    '<div class="stat"><b>'+c.done+'/'+tasks.length+'</b><span>tasks done</span></div>'+
    '<div class="stat"><b>'+c.doing+'</b><span>in progress</span></div>'+
    '<div class="stat"><b>'+c.blocked+'</b><span>blocked</span></div>'+
    '<div class="stat"><b>'+Math.round(remainingPoints())+'</b><span>points left</span></div>';
}

function renderTabs(){
  var el=document.getElementById("tabs");
  el.innerHTML=TABS.map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.ui.tab===t[0])+'">'+t[1]+'</button>';}).join("");
}

function nextUp(){
  var out=[];
  tasks.forEach(function(t){ if(tState(t.id).s==="doing") out.push(t); });
  tasks.forEach(function(t){
    if(out.length>=8) return;
    var p=phaseById[t.phase];
    if(tState(t.id).s!=="todo"||!depsDone(p)) return;
    if(t.dep.every(function(d){return tState(d).s==="done";})) out.push(t);
  });
  return out.slice(0,8);
}

function renderOverview(){
  var h='<div class="grid cols-3">';
  PLAN.phases.forEach(function(p){
    var st=pStatus(p), pr=pProg(p), ready=depsDone(p);
    h+='<div class="card"><div class="row spread"><h3>'+esc(p.id)+' · '+esc(p.name)+'</h3>'+stChip(st)+'</div>'+
      '<p class="muted small" style="margin:0 0 10px">'+esc(p.goal)+'</p>'+bar(pr,st==="done"?"done":"")+
      '<div class="row spread small" style="margin-top:8px"><span>'+pct(pr)+'% · '+p.tasks.filter(function(t){return tState(t.id).s==="done";}).length+'/'+p.tasks.length+' tasks · '+pPoints(p)+' pts</span>'+
      '<button class="btn sm line" data-open="'+p.id+'">Open</button></div>'+
      (p.deps.length?'<p class="small muted" style="margin:8px 0 0">Needs: '+p.deps.map(function(d){var ok=pStatus(phaseById[d])==="done";return esc(d)+(ok?" ✓":"");}).join(", ")+(ready?"":" · <b>waiting</b>")+'</p>':'')+
      '</div>';
  });
  h+='</div>';
  var nu=nextUp();
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px">';
  h+='<div class="card"><h3>Next up</h3>'+(nu.length?'<ul class="clean" style="list-style:none;padding:0">'+nu.map(function(t){return '<li style="margin:6px 0"><button class="btn sm line" data-open="'+t.phase+'" data-task="'+t.id+'">'+esc(t.id)+'</button> '+esc(t.t)+' '+stChip(tState(t.id).s)+'</li>';}).join("")+'</ul>':'<p class="muted">Nothing ready. Check blocked items or finish dependencies.</p>')+'</div>';
  var bl=tasks.filter(function(t){return tState(t.id).s==="blocked";});
  h+='<div class="card"><h3>Blocked</h3>'+(bl.length?'<ul class="clean">'+bl.map(function(t){return '<li>'+esc(t.id)+' '+esc(t.t)+'<br><span class="muted small">'+esc(tState(t.id).b||"No reason recorded")+'</span></li>';}).join("")+'</ul>':'<p class="muted">No blocked tasks.</p>')+'</div>';
  var openD=PLAN.decisions.filter(function(d){return decState(d.id).s==="open";});
  h+='<div class="card"><h3>Open decisions</h3>'+(openD.length?'<ul class="clean">'+openD.map(function(d){return '<li><b>'+esc(d.id)+'</b> '+esc(d.t)+'</li>';}).join("")+'</ul>':'<p class="muted">All decided.</p>')+'</div>';
  var rem=remainingPoints(), wk=S.v>0?rem/S.v:0;
  h+='<div class="card"><h3>Forecast</h3><p class="small muted" style="margin-top:0">Effort uses points (S=1, M=3, L=5). Enter your real pace to project the remaining work. This is an estimate, not a commitment.</p><div class="row"><label for="vel">Points per week</label><input id="vel" type="number" min="1" max="100" value="'+S.v+'" style="width:90px"></div><p style="margin:10px 0 0"><b>'+Math.round(rem)+'</b> points left ≈ <b>'+wk.toFixed(1)+'</b> weeks</p></div>';
  h+='</div>';
  return h;
}

function visibleTask(t){
  var f=S.ui, st=tState(t.id);
  if(f.status&&st.s!==f.status) return false;
  if(f.hideDone&&st.s==="done") return false;
  if(f.layers.length&&!t.l.some(function(l){return f.layers.indexOf(l)>=0;})) return false;
  if(f.q){ var q=f.q.toLowerCase(); if((t.id+" "+t.t+" "+t.d).toLowerCase().indexOf(q)<0) return false; }
  return true;
}
function filtersBar(){
  var f=S.ui;
  return '<div class="filters">'+
    '<input type="search" id="q" placeholder="Search tasks" aria-label="Search tasks" value="'+esc(f.q||"")+'">'+
    '<select class="status" id="fstatus" aria-label="Filter by status"><option value="">All statuses</option>'+STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(f.status===s[0]?" selected":"")+'>'+s[1]+'</option>';}).join("")+'</select>'+
    Object.keys(PLAN.layers).map(function(l){return '<button class="layerbtn" data-layer="'+l+'" aria-pressed="'+(f.layers.indexOf(l)>=0)+'" title="'+esc(PLAN.layers[l])+'">'+l+' · '+esc(PLAN.layers[l].split(" ")[0])+'</button>';}).join("")+
    '<label class="small"><input type="checkbox" id="fhide"'+(f.hideDone?" checked":"")+'> Hide done</label>'+
    '<button class="btn sm line" id="expandAll">Expand all</button><button class="btn sm line" id="collapseAll">Collapse all</button></div>';
}
function renderTask(t){
  var st=tState(t.id), open=!!S.ui.open[t.id], acDone=st.ac.filter(Boolean).length;
  var h='<div class="task '+(st.s==="done"?"done":"")+'" id="task-'+esc(t.id)+'"><div class="th">'+
   '<select class="status" data-status="'+t.id+'" aria-label="Status of '+esc(t.t)+'">'+STATUSES.map(function(s){return '<option value="'+s[0]+'"'+(st.s===s[0]?" selected":"")+'>'+s[1]+'</option>';}).join("")+'</select>'+
   '<span class="kbd">'+esc(t.id)+'</span>'+
   '<button class="title" data-toggle="'+t.id+'" aria-expanded="'+open+'">'+esc(t.t)+'</button>'+
   layerChips(t)+' '+chip(t.s+" · "+WEIGHT[t.s]+" pt","")+' '+(t.ac.length?'<span class="small muted">'+acDone+'/'+t.ac.length+'</span>':'')+'</div>';
  if(open){
    h+='<div class="detail"><p style="margin:8px 0">'+esc(t.d)+'</p>';
    h+='<div class="small muted" style="margin-bottom:4px"><b>Done when</b></div>'+t.ac.map(function(a,i){return '<label class="ac"><input type="checkbox" data-ac="'+t.id+':'+i+'"'+(st.ac[i]?" checked":"")+'><span>'+esc(a)+'</span></label>';}).join("");
    if(t.a.length) h+='<p class="small muted" style="margin:10px 0 4px"><b>Where</b>: '+t.a.map(function(a){return '<span class="kbd">'+esc(a)+'</span>';}).join(" ")+'</p>';
    if(t.dep.length) h+='<p class="small muted" style="margin:4px 0"><b>Depends on</b>: '+t.dep.map(function(d){var ok=tState(d).s==="done";return '<span class="kbd">'+esc(d)+(ok?" ✓":" …")+'</span>';}).join(" ")+'</p>';
    if(st.s==="blocked") h+='<label class="small" for="b-'+t.id+'"><b>Why blocked</b></label><input type="text" id="b-'+t.id+'" data-block="'+t.id+'" value="'+esc(st.b)+'">';
    h+='<label class="small" for="n-'+t.id+'" style="display:block;margin-top:8px"><b>Notes</b></label><textarea id="n-'+t.id+'" data-note="'+t.id+'" placeholder="Decisions, links, findings">'+esc(st.n)+'</textarea></div>';
  }
  return h+'</div>';
}
function renderPhases(){
  var h=filtersBar();
  PLAN.phases.forEach(function(p){
    var list=p.tasks.filter(visibleTask);
    if(!list.length&&(S.ui.q||S.ui.status||S.ui.layers.length||S.ui.hideDone)) return;
    var open=S.ui.phasesOpen[p.id]!==false&&(S.ui.phasesOpen[p.id]===true||pStatus(p)!=="done");
    var st=pStatus(p), pr=pProg(p);
    h+='<section class="card phase" id="phase-'+p.id+'"><button class="ph" data-phase="'+p.id+'" aria-expanded="'+open+'"><div class="row spread"><h3 style="margin:0;font-size:18px">'+esc(p.id)+' · '+esc(p.name)+'</h3><div class="row">'+stChip(st)+'<span class="small muted">'+pct(pr)+'%</span></div></div><p class="muted small" style="margin:4px 0 8px">'+esc(p.goal)+'</p>'+bar(pr,st==="done"?"done":"")+'</button>';
    if(open){
      var ex=S.e[p.id]||[];
      h+='<div class="body"><div class="small muted" style="margin:10px 0 4px"><b>Phase exit criteria</b>'+(p.deps.length?' · needs '+p.deps.join(", "):"")+'</div>'+
        p.exit.map(function(e,i){return '<label class="ac"><input type="checkbox" data-exit="'+p.id+':'+i+'"'+(ex[i]?" checked":"")+'><span>'+esc(e)+'</span></label>';}).join("")+
        list.map(renderTask).join("")+'</div>';
    }
    h+='</section>';
  });
  return h;
}
function renderBoard(){
  var sel=S.ui.boardPhase||"all";
  var h='<div class="filters"><label class="small" for="bphase">Phase</label><select class="status" id="bphase"><option value="all">All phases</option>'+PLAN.phases.map(function(p){return '<option value="'+p.id+'"'+(sel===p.id?" selected":"")+'>'+esc(p.id)+' · '+esc(p.name)+'</option>';}).join("")+'</select><span class="small muted">Drag cards between columns, or use the status menu on a card.</span></div><div class="board">';
  STATUSES.forEach(function(s){
    var list=tasks.filter(function(t){return (sel==="all"||t.phase===sel)&&tState(t.id).s===s[0];});
    h+='<div class="col" data-drop="'+s[0]+'" aria-label="'+s[1]+'"><h4><span>'+s[1]+'</span><span class="muted">'+list.length+'</span></h4>'+
      list.map(function(t){return '<div class="kcard" draggable="true" data-drag="'+t.id+'"><div class="row spread"><span class="kbd">'+esc(t.id)+'</span>'+chip(t.s,"")+'</div><div style="margin:6px 0;font-weight:700">'+esc(t.t)+'</div><div class="row">'+layerChips(t)+'</div><select class="status" style="margin-top:8px" data-status="'+t.id+'" aria-label="Status of '+esc(t.t)+'">'+STATUSES.map(function(x){return '<option value="'+x[0]+'"'+(s[0]===x[0]?" selected":"")+'>'+x[1]+'</option>';}).join("")+'</select></div>';}).join("")+'</div>';
  });
  return h+'</div>';
}
function renderGaps(){
  var h='<div class="card"><h3>What the app needs vs what the API offers today</h3><p class="small muted" style="margin-top:0">Based on the controllers and DTOs in src/QuickCommerce.Api and Application at plan time.</p><div class="tableWrap"><table><thead><tr><th>App feature</th><th>API</th><th>Detail</th><th>Phase</th></tr></thead><tbody>'+
    PLAN.gaps.map(function(g){return '<tr><td>'+esc(g.f)+'</td><td class="api-'+g.api+'">'+esc(g.api)+'</td><td class="small">'+esc(g.n)+'</td><td><button class="btn sm line" data-open="'+g.p+'">'+esc(g.p)+'</button></td></tr>';}).join("")+'</tbody></table></div></div>';
  h+='<div class="card" style="margin-top:14px"><h3>Risks</h3><div class="tableWrap"><table><thead><tr><th>ID</th><th>Risk</th><th>Severity</th><th>Mitigation</th><th>Phase</th></tr></thead><tbody>'+
    PLAN.risks.map(function(r){return '<tr><td>'+esc(r.id)+'</td><td>'+esc(r.t)+'</td><td class="sev-'+r.sev+'">'+({H:"High",M:"Medium",L:"Low"}[r.sev])+'</td><td class="small">'+esc(r.m)+'</td><td>'+esc(r.p)+'</td></tr>';}).join("")+'</tbody></table></div></div>';
  return h;
}
function decState(id){ var d=PLAN.decisions.filter(function(x){return x.id===id;})[0]; var o=S.d[id]||{}; return {s:o.s||d.s,n:o.n!=null?o.n:d.n}; }
function renderDecisions(){
  var h='<div class="card"><h3>Decisions</h3><div class="tableWrap"><table><thead><tr><th>ID</th><th>Decision</th><th>Status</th><th>Notes</th></tr></thead><tbody>'+
    PLAN.decisions.map(function(d){var st=decState(d.id);return '<tr><td>'+esc(d.id)+'</td><td>'+esc(d.t)+'</td><td><select class="status" data-dec="'+d.id+'" aria-label="Status of decision '+esc(d.id)+'"><option value="open"'+(st.s==="open"?" selected":"")+'>Open</option><option value="decided"'+(st.s==="decided"?" selected":"")+'>Decided</option></select></td><td><input type="text" data-decnote="'+d.id+'" value="'+esc(st.n)+'" aria-label="Notes for '+esc(d.id)+'"></td></tr>';}).join("")+'</tbody></table></div></div>';
  h+='<div class="card" style="margin-top:14px"><h3>Engineering guardrails</h3><p class="small muted" style="margin-top:0">Summarised from docs/copilot-instructions.md. Apply them to every task.</p><ul class="clean">'+PLAN.guardrails.map(function(g){return '<li>'+esc(g)+'</li>';}).join("")+'</ul></div>';
  h+='<div class="card" style="margin-top:14px"><h3>Backlog after the first release</h3><ul class="clean">'+PLAN.backlog.map(function(b){return '<li>'+esc(b)+'</li>';}).join("")+'</ul></div>';
  return h;
}

function render(){
  var ae=document.activeElement, id=ae&&ae.id, pos=ae&&ae.selectionStart;
  var y=window.scrollY;
  renderHeader(); renderTabs();
  var v=S.ui.tab, html={overview:renderOverview,phases:renderPhases,board:renderBoard,gaps:renderGaps,decisions:renderDecisions}[v]();
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,y);
  if(id){ var n=document.getElementById(id); if(n){ n.focus(); try{ if(pos!=null) n.setSelectionRange(pos,pos);}catch(e){} } }
}
function go(tab,phase,task){
  S.ui.tab=tab; if(phase){ S.ui.phasesOpen[phase]=true; } if(task){ S.ui.open[task]=true; } save(); render();
  if(phase){ var el=document.getElementById(task?"task-"+task:"phase-"+phase); if(el) el.scrollIntoView({block:"start"}); }
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-tab],[data-open],[data-toggle],[data-phase],[data-layer],#expandAll,#collapseAll");
  if(!b) return;
  if(b.dataset.tab){ S.ui.tab=b.dataset.tab; save(); render(); window.scrollTo(0,0); }
  else if(b.dataset.open){ go("phases",b.dataset.open,b.dataset.task); }
  else if(b.dataset.toggle){ var t=b.dataset.toggle; S.ui.open[t]=!S.ui.open[t]; save(); render(); }
  else if(b.dataset.phase){ var p=b.dataset.phase; var cur=S.ui.phasesOpen[p]!==false&&(S.ui.phasesOpen[p]===true||pStatus(phaseById[p])!=="done"); S.ui.phasesOpen[p]=!cur; save(); render(); }
  else if(b.dataset.layer){ var l=b.dataset.layer, i=S.ui.layers.indexOf(l); if(i>=0)S.ui.layers.splice(i,1); else S.ui.layers.push(l); save(); render(); }
  else if(b.id==="expandAll"){ tasks.forEach(function(t){S.ui.open[t.id]=true;}); PLAN.phases.forEach(function(p){S.ui.phasesOpen[p.id]=true;}); save(); render(); }
  else if(b.id==="collapseAll"){ S.ui.open={}; save(); render(); }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.status){ var prev=tState(t.dataset.status).s; setT(t.dataset.status,{s:t.value}); if(t.value==="blocked"){S.ui.open[t.dataset.status]=true;save();} if(t.value==="done"&&prev!=="done"){ var c=tState(t.dataset.status); setT(t.dataset.status,{ac:c.ac.map(function(){return true;})}); } render(); }
  else if(t.dataset.ac){ var a=t.dataset.ac.split(":"),st=tState(a[0]),ac=st.ac.slice(); ac[+a[1]]=t.checked; setT(a[0],{ac:ac}); if(ac.every(Boolean)&&st.s!=="done") toast("All criteria met. Set the task to Done when verified."); render(); }
  else if(t.dataset.exit){ var x=t.dataset.exit.split(":"),arr=(S.e[x[0]]||[]).slice(); arr[+x[1]]=t.checked; S.e[x[0]]=arr; save(); }
  else if(t.dataset.dec){ S.d[t.dataset.dec]=Object.assign({},S.d[t.dataset.dec],{s:t.value}); save(); render(); }
  else if(t.dataset.decnote){ S.d[t.dataset.decnote]=Object.assign({},S.d[t.dataset.decnote],{n:t.value}); save(); }
  else if(t.dataset.note){ setT(t.dataset.note,{n:t.value}); }
  else if(t.dataset.block){ setT(t.dataset.block,{b:t.value}); }
  else if(t.id==="fstatus"){ S.ui.status=t.value; save(); render(); }
  else if(t.id==="fhide"){ S.ui.hideDone=t.checked; save(); render(); }
  else if(t.id==="bphase"){ S.ui.boardPhase=t.value; save(); render(); }
  else if(t.id==="vel"){ S.v=Math.max(1,+t.value||5); save(); render(); }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){ S.ui.q=t.value; save(); render(); }
  else if(t.dataset.note){ setT(t.dataset.note,{n:t.value}); }
});
var dragId=null;
document.addEventListener("dragstart",function(e){ var c=e.target.closest("[data-drag]"); if(c){ dragId=c.dataset.drag; e.dataTransfer.setData("text/plain",dragId); e.dataTransfer.effectAllowed="move"; } });
document.addEventListener("dragover",function(e){ var c=e.target.closest("[data-drop]"); if(c&&dragId){ e.preventDefault(); c.classList.add("over"); } });
document.addEventListener("dragleave",function(e){ var c=e.target.closest("[data-drop]"); if(c) c.classList.remove("over"); });
document.addEventListener("drop",function(e){ var c=e.target.closest("[data-drop]"); if(c&&dragId){ e.preventDefault(); var s=c.dataset.drop,prev=tState(dragId).s; setT(dragId,{s:s}); if(s==="done"&&prev!=="done"){ setT(dragId,{ac:tState(dragId).ac.map(function(){return true;})}); } dragId=null; render(); } });
document.addEventListener("dragend",function(){ dragId=null; });

function download(name,text){ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500); }
document.getElementById("btnExport").addEventListener("click",function(){
  var data={app:"quickcart-mobile-plan",version:PLAN.meta.version,exportedAt:new Date().toISOString(),tasks:S.t,exitCriteria:S.e,decisions:S.d,pointsPerWeek:S.v};
  download("quickcart-progress-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(data,null,2)); toast("Progress exported");
});
document.getElementById("btnImport").addEventListener("click",function(){ document.getElementById("fileImport").click(); });
document.getElementById("fileImport").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return; var r=new FileReader();
  r.onload=function(){ try{ var d=JSON.parse(r.result); if(d.app!=="quickcart-mobile-plan") throw new Error("Not a QuickCart progress file"); S.t=d.tasks||{}; S.e=d.exitCriteria||{}; S.d=d.decisions||{}; S.v=d.pointsPerWeek||S.v; save(); render(); toast("Progress imported"); }catch(err){ toast("Import failed: "+err.message); } };
  r.readAsText(f); e.target.value="";
});
document.getElementById("btnReset").addEventListener("click",function(){
  if(window.confirm("Discard your saved changes and go back to the status stored in this file?")){ S.t={}; S.e={}; S.d={}; save(); render(); toast("Reset to file baseline"); }
});
document.getElementById("btnSummary").addEventListener("click",function(){
  var lines=["# QuickCart mobile progress ("+new Date().toISOString().slice(0,10)+")","","Overall: "+pct(overall())+"% · "+counts().done+"/"+tasks.length+" tasks done","","| Phase | Status | Progress |","|---|---|---|"];
  PLAN.phases.forEach(function(p){lines.push("| "+p.id+" "+p.name+" | "+pStatus(p)+" | "+pct(pProg(p))+"% |");});
  lines.push("","Next up:"); nextUp().forEach(function(t){lines.push("- "+t.id+" "+t.t);});
  var bl=tasks.filter(function(t){return tState(t.id).s==="blocked";}); if(bl.length){lines.push("","Blocked:"); bl.forEach(function(t){lines.push("- "+t.id+" "+t.t+": "+(tState(t.id).b||"no reason recorded"));});}
  var text=lines.join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){toast("Summary copied");},function(){ var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Summary copied");}catch(e){toast("Copy failed");} ta.remove(); });
});
function applyTheme(){ var t=S.ui.theme||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"); document.documentElement.setAttribute("data-theme",t); }
document.getElementById("btnTheme").addEventListener("click",function(){ S.ui.theme=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; save(); applyTheme(); });
applyTheme(); render();
})();
</script>
</body>
</html>
